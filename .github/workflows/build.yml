name: Build

on:
  push:
    branches: [ master, main ]
  pull_request:
  workflow_dispatch:

defaults:
  run:
    working-directory: LootBeamsFabricUpdated-master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: LootBeamsFabricUpdated-master

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew build

      - name: Upload jars
        uses: actions/upload-artifact@v4
        with:
          name: lootbeams-1.21.4
          path: LootBeamsFabricUpdated-master/build/libs/*.jar
