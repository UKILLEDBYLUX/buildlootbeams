name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find project directory
        id: find
        run: |
          echo "Содержимое корня репозитория:"
          ls -la
          FILE=$(find . -name settings.gradle -not -path "./.git/*" | head -n 1)
          if [ -z "$FILE" ]; then
            echo "::error::settings.gradle не найден. Проект не залит в репозиторий (или залит как zip)."
            echo "Найденные zip-файлы:"
            find . -name "*.zip" -not -path "./.git/*"
            exit 1
          fi
          DIR=$(dirname "$FILE")
          echo "Проект найден в: $DIR"
          echo "dir=$DIR" >> "$GI
