name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        id: find
        run: |
          mkdir project
          unzip -q LootBeamsFabric-1.21.4.zip -d project
          FILE=$(find project -name settings.gradle | head -n 1)
          if [ -z "$FILE" ]; then
            echo "::error::settings.gradle не найден внутри zip"
            exit 1
          fi
          DIR=$(dirname "$FILE")
          echo "Проект найден в: $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.12

      - name: Build
        working-directory: ${{ steps.find.outputs.dir }}
        run: gradle build

      - name: Upload jars
        uses: actions/upload-artifact@v4
        with:
          name: lootbeams-1.21.4
          path: ${{ steps.find.outputs.dir }}/build/libs/*.jar
